<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PixelMart — Demo Electronics Store</title>
<style>
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; margin: 0; background: #f7f7f8; color: #1a1a1a; }
  header { background: #10151f; color: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  header .brand { font-weight: 700; font-size: 18px; }
  header .cart { font-size: 13px; color: #cfd6e4; }
  header .menu-btn { display: none; background: transparent; border: 1px solid #3a4356; color: #fff; border-radius: 6px; padding: 6px 10px; font-size: 14px; cursor: pointer; }

  /* Sort and filter are deliberately grouped close together with similar
     styling weight — a realistic source of confusion, not a fabricated bug. */
  .toolbar { display: flex; gap: 8px; padding: 14px 24px; background: #fff; border-bottom: 1px solid #e5e5e5; align-items: center; flex-wrap: wrap; }
  .toolbar input { flex: 1; min-width: 180px; padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
  .sort-group { display: flex; gap: 4px; }
  .sort-pill { padding: 7px 10px; border: 1px solid #ccc; background: #fafafa; border-radius: 6px; font-size: 12px; cursor: pointer; }
  .sort-pill.active { background: #10151f; color: #fff; border-color: #10151f; }
  /* Low-contrast, text-only trigger — the price filter is real but easy to miss. */
  #filter-toggle { font-size: 12px; color: #999; text-decoration: underline; background: none; border: none; cursor: pointer; padding: 7px 4px; }

  #filter-panel { display: none; padding: 12px 24px; background: #eef1f6; border-bottom: 1px solid #dde; }
  #filter-panel.open { display: block; }
  .facet-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 4px 0; }
  .facet-label { font-size: 12px; color: #667; width: 64px; }
  .facet-pill { padding: 6px 10px; border: 1px solid #c7cede; background: #fff; border-radius: 999px; font-size: 12px; cursor: pointer; }
  .facet-pill.active { background: #0f766e; color: #fff; border-color: #0f766e; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; padding: 20px 24px; }
  .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 12px; }
  .card h3 { font-size: 14px; margin: 8px 0 2px; }
  .card .spec { font-size: 11px; color: #8a93a6; margin-bottom: 6px; }
  .card .price { color: #444; font-size: 13px; margin-bottom: 8px; font-weight: 600; }
  .card .swatch { height: 90px; background: #d9dce3; border-radius: 6px; }
  .card .actions { display: flex; gap: 6px; }
  .card .actions button { flex: 1; padding: 8px 4px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .card .add-to-cart { background: #eef1f6; color: #10151f; border: 1px solid #ccd3e0 !important; }
  .card .buy-now { background: #10151f; color: #fff; }
  .card button:disabled { background: #cbd2e0; color: #667; cursor: default; border-color: #cbd2e0 !important; }

  #checkout-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); align-items: center; justify-content: center; }
  #checkout-modal.open { display: flex; }
  .modal-box { background: #fff; padding: 20px; border-radius: 8px; width: 320px; }
  .modal-box input { width: 100%; padding: 8px; margin: 6px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
  .modal-box button { width: 100%; padding: 9px; background: #10151f; color: #fff; border: none; border-radius: 6px; margin-top: 8px; cursor: pointer; }
  #confirm { display: none; padding: 40px; text-align: center; }
  #confirm.open { display: block; }
  .hint { font-size: 12px; color: #888; padding: 0 24px 12px; }
  .empty { padding: 40px 24px; text-align: center; color: #888; font-size: 13px; }

  /* Mobile: the filter/sort toolbar collapses behind a menu button, and
     re-appears as an overlay panel — a real, common source of mobile-only
     friction (an extra tap just to reach controls visible by default on
     desktop), not an artificial defect. */
  @media (max-width: 480px) {
    header .menu-btn { display: inline-block; }
    .toolbar .sort-group, .toolbar #filter-toggle { display: none; }
    .toolbar.mobile-open .sort-group, .toolbar.mobile-open #filter-toggle { display: flex; }
    .toolbar.mobile-open { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">PixelMart</div>
  <div style="display:flex; align-items:center; gap:10px;">
    <button class="menu-btn" id="menu-btn">☰ Menu</button>
    <div class="cart">Cart: <span id="cart-badge">0</span></div>
  </div>
</header>

<div class="toolbar" id="toolbar">
  <input id="search-input" placeholder="Search products..." />
  <div class="sort-group">
    <button class="sort-pill active" data-sort="featured">Featured</button>
    <button class="sort-pill" data-sort="price-asc">Price ↑</button>
    <button class="sort-pill" data-sort="price-desc">Price ↓</button>
  </div>
  <button id="filter-toggle">Filter ▾</button>
</div>

<div id="filter-panel">
  <div class="facet-row">
    <span class="facet-label">Category</span>
    <button class="facet-pill" data-cat="laptop">Laptops</button>
    <button class="facet-pill" data-cat="phone">Phones</button>
    <button class="facet-pill" data-cat="audio">Audio</button>
  </div>
  <div class="facet-row">
    <span class="facet-label">Price</span>
    <button class="facet-pill" data-price="30000">Under ₹30,000</button>
    <button class="facet-pill" data-price="60000">Under ₹60,000</button>
    <button class="facet-pill" data-price="100000">Under ₹1,00,000</button>
    <button class="facet-pill" data-price="0">All prices</button>
  </div>
</div>

<p class="hint">Try: find a laptop under ₹60,000 and complete the purchase.</p>

<div class="grid" id="product-grid"></div>

<div id="checkout-modal">
  <div class="modal-box">
    <h3>Checkout</h3>
    <input id="email-input" placeholder="Email (optional)" />
    <button id="buy-btn">Buy</button>
  </div>
</div>

<div id="confirm">
  <h2>Order confirmed</h2>
  <p>Thanks for your purchase — a receipt has been emailed to you.</p>
</div>

<script>
  // AeroBook listed first so a naive first-match strategy still tends to land
  // on an in-budget laptop; category/price facets narrow reliably regardless.
  const products = [
    { id: "laptop-aero", name: "AeroBook 14 Laptop", spec: "Intel i5 · 8GB RAM · 256GB SSD", price: 54999, cat: "laptop" },
    { id: "laptop-titan", name: "TitanBook Pro Laptop", spec: "Intel i7 · 16GB RAM · 512GB SSD", price: 78499, cat: "laptop" },
    { id: "phone-nova", name: "NovaPhone X", spec: "6.1in · 128GB · 5G", price: 34999, cat: "phone" },
    { id: "audio-sonic", name: "SonicWave Headphones", spec: "ANC · 30hr battery", price: 2499, cat: "audio" },
  ];

  const grid = document.getElementById("product-grid");
  const fmt = (n) => "₹" + n.toLocaleString("en-IN");

  const state = { query: "", cat: null, maxPrice: null, sort: "featured" };

  function visibleList() {
    let list = products;
    if (state.query) list = list.filter((p) => p.name.toLowerCase().includes(state.query));
    if (state.cat) list = list.filter((p) => p.cat === state.cat);
    if (state.maxPrice) list = list.filter((p) => p.price < state.maxPrice);
    list = [...list];
    if (state.sort === "price-asc") list.sort((a, b) => a.price - b.price);
    if (state.sort === "price-desc") list.sort((a, b) => b.price - a.price);
    return list;
  }

  function render() {
    const list = visibleList();
    grid.innerHTML = "";
    if (list.length === 0) {
      grid.innerHTML = '<div class="empty">No products match your search.</div>';
      return;
    }
    list.forEach((p) => {
      const el = document.createElement("div");
      el.className = "card";
      el.innerHTML = `<div class="swatch"></div><h3>${p.name}</h3><div class="spec">${p.spec}</div>
        <div class="price">${fmt(p.price)}</div>
        <div class="actions">
          <button data-id="${p.id}" class="add-to-cart">Add to Cart</button>
          <button data-id="${p.id}" class="buy-now">Buy Now</button>
        </div>`;
      grid.appendChild(el);
    });
  }
  render();

  let cartCount = 0;
  const bump = () => { cartCount++; document.getElementById("cart-badge").textContent = cartCount; };

  document.getElementById("search-input").addEventListener("input", (e) => {
    state.query = e.target.value.trim().toLowerCase();
    render();
  });

  document.querySelectorAll(".sort-pill").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".sort-pill").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      state.sort = btn.dataset.sort;
      render();
    });
  });

  document.getElementById("filter-toggle").addEventListener("click", () => {
    document.getElementById("filter-panel").classList.toggle("open");
  });

  document.querySelectorAll(".facet-pill[data-cat]").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".facet-pill[data-cat]").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      state.cat = btn.dataset.cat;
      render();
    });
  });

  document.querySelectorAll(".facet-pill[data-price]").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".facet-pill[data-price]").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      const v = Number(btn.dataset.price);
      state.maxPrice = v > 0 ? v : null;
      render();
    });
  });

  // Add to Cart quietly adds one unit and stays on the page — a plausible
  // first click for "get this item" that doesn't actually reach checkout.
  // Buy Now adds one unit and opens checkout directly. Both remain usable
  // (multiple adds are allowed), matching real storefront behavior.
  document.body.addEventListener("click", (e) => {
    if (e.target.classList.contains("add-to-cart")) {
      bump();
      e.target.textContent = "Added ✓";
      setTimeout(() => { e.target.textContent = "Add to Cart"; }, 1500);
    }
    if (e.target.classList.contains("buy-now")) {
      bump();
      // Disable every Buy Now button (not just this one) once checkout has
      // started — otherwise another product's still-enabled Buy Now sits
      // beneath the modal overlay, unreachable but still "visible" to a
      // naive re-scan, which is exactly the kind of stuck-click trap this
      // demo is meant to model deliberately elsewhere, not accidentally here.
      document.querySelectorAll(".buy-now").forEach((b) => { b.disabled = true; });
      document.getElementById("checkout-modal").classList.add("open");
    }
  });

  document.getElementById("buy-btn").addEventListener("click", () => {
    document.getElementById("checkout-modal").classList.remove("open");
    document.getElementById("confirm").classList.add("open");
  });

  document.getElementById("menu-btn").addEventListener("click", () => {
    document.getElementById("toolbar").classList.toggle("mobile-open");
  });
</script>
</body>
</html>
